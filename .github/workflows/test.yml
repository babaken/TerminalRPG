name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install --upgrade pip pytest cryptography Pillow
      - name: Check sample scenarios
        run: |
          python -m trpg --check scenarios/FirstQuest
          python -m trpg --check scenarios/FirstQuestPlus
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
      - name: Pack sample scenarios
        run: |
          python -m trpg.tools.pack scenarios/FirstQuest -o FirstQuest.zip --strict
          python -m trpg.tools.pack scenarios/FirstQuestPlus -o FirstQuestPlus.zip --strict
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
      - name: Test
        run: python -m pytest -q
        env:
          PYTHONIOENCODING: utf-8
