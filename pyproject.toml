[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trpg"
version = "0.9.0"
description = "ASCII アートで表現するコンソール RPG エンジン"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]   # セーブデータの暗号化（AES-256-GCM）

[project.optional-dependencies]
dev = ["pytest", "Pillow"]
tools = ["Pillow"]                    # AA 変換ツール

[project.scripts]
trpg = "trpg.__main__:main"
trpg-pack = "trpg.tools.pack:main"
trpg-aa = "trpg.tools.aa_convert:main"
trpg-mapedit = "trpg.tools.map_editor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
