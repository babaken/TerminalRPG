[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trpg"
version = "1.1.0"
description = "ASCII アートで表現するコンソール RPG エンジン"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bbk" }]
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]   # セーブデータの暗号化（AES-256-GCM）

[project.optional-dependencies]
dev = ["pytest", "Pillow"]
tools = ["Pillow"]                    # AA 変換ツール

[project.scripts]
trpg = "trpg.__main__:main"
trpg-pack = "trpg.tools.pack:main"
trpg-aa = "trpg.tools.aa_convert:main"
trpg-mapedit = "trpg.tools.map_editor:main"

[tool.setuptools]
# エンジンのパッケージ（新しいサブパッケージを作ったらここにも足す。tests/test_distribution.py が確認する）
packages = [
  "trpg", "trpg.battle", "trpg.data", "trpg.effects", "trpg.i18n", "trpg.package", "trpg.save",
  "trpg.scenes", "trpg.script", "trpg.term", "trpg.tools", "trpg.ui", "trpg.world",
  # 同梱のサンプルシナリオ（pip で入れると trpg/bundled/<名前>/ に入り、どこからでも遊べる）
  "trpg.bundled.FirstQuest", "trpg.bundled.FirstQuest.aa",
  "trpg.bundled.FirstQuestPlus", "trpg.bundled.FirstQuestPlus.aa",
]

[tool.setuptools.package-dir]
"" = "src"
"trpg.bundled.FirstQuest" = "scenarios/FirstQuest"
"trpg.bundled.FirstQuest.aa" = "scenarios/FirstQuest/aa"
"trpg.bundled.FirstQuestPlus" = "scenarios/FirstQuestPlus"
"trpg.bundled.FirstQuestPlus.aa" = "scenarios/FirstQuestPlus/aa"

[tool.setuptools.package-data]
"trpg.bundled.FirstQuest" = ["*"]
"trpg.bundled.FirstQuest.aa" = ["*"]
"trpg.bundled.FirstQuestPlus" = ["*"]
"trpg.bundled.FirstQuestPlus.aa" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
