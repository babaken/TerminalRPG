# FirstQuest+ シナリオパッケージ定義（案C「主人公の正体」。FirstQuest とはセーブ非互換）
[package]
id = "firstquest_plus"
title = "FirstQuest+"
version = "1.1.0"
author = "babaken"
engine = ">=1.0"
languages = ["ja"]

[title_screen]
aa = "aa/title.txt"
effect = "starfall"

[rules]
gameover = "choose"        # retry_from_save | title | choose
save = "anywhere"          # anywhere | save_point_only
party_max = 4
start_label = "start"

[start]
party = ["hero"]
gold = 0
items = []
